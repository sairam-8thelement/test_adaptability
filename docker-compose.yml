name: blazorecommerce

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: blazorecommerce-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
    ports:
      - "${DB_PORT:-14333}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: blazorecommerce-app
    container_name: blazorecommerce-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Server=db,1433;Database=blazorecommerce;User Id=sa;
        Password=${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd};
        TrustServerCertificate=True;Encrypt=False
      AppSettings__Token: ${JWT_TOKEN_KEY:-change-me-to-a-long-random-secret-key}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      # No curl in the runtime image, so probe the API over bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /api/product HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && head -n1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  mssql-data:
